<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña - Helisa</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    .header, .footer {
      text-align: center;
      padding: 15px;
    }
    .header img, .footer img {
      width: 140px;
    }
    .content {
      padding: 30px;
      text-align: center;
    }
    .content h2 {
      color: #444;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .content p {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
    }
    .svg-icon {
      margin: 25px 0;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #808080;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 20px;
    }
    .note {
      margin-top: 25px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Encabezado -->
    <div class="header">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_55Cncd0Gou90Aqh1QOV9qCtNwKNd6ysf6A&s" alt="Helisa Logo" />
    </div>

    <!-- Contenido -->
    <div class="content">
      <div class="svg-icon">
        <!-- SVG CENTRAL -->
        <svg width="400" height="400" viewBox="0 0 436 431" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- aquí va tu SVG completo -->
        </svg>
      </div>

      <h2>Gestor Documental</h2>
      <p>Señor usuario, se ha generado una solicitud que requiere su revisión en el documento <strong>{{nombreArchivo}}</strong>.</p>

      <!-- Botón con link directo al login -->
      <a href="http://localhost:4200/login" class="btn">Revisar Solicitud</a>

      <p class="note">
      Si no reconoce esta notificación, por favor comuníquese con su administrador.
      </p>
    </div>

    <!-- Pie -->
    <div class="footer">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_55Cncd0Gou90Aqh1QOV9qCtNwKNd6ysf6A&s" alt="Helisa Logo" />
    </div>
  </div>
</body>
</html>
