spring.application.name=docmanager

# ====== DATASOURCE CONFIG ======
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor
spring.datasource.username=gestor_user
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / HIBERNATE CONFIG ======
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ====== LOGS Y FORMATO OPCIONAL ======
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF


storage.base-path=/opt/gd/files
storage.max-pdf-bytes=52428800
storage.max-attachment-bytes=10485760
storage.allowed-attachment-ext=jpg,png,pdf,docx,xlsx,txt


spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.com.helisa.docmanager=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n


# JWT Configuration
security.jwt.secret=mySecretKey123456789012345678901234567890
security.jwt.expiration-ms=86400000

# ====== EMAIL CONFIGURATION ======
spring.mail.host=smtp.office365.com
spring.mail.port=587
spring.mail.username=noresponder@helisa.com
spring.mail.password=N40YhPnD3fsHw17*
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



# ====== APP CONFIGURATION ======
app.mail.from=noresponder@helisa.com
app.mail.subject.prefix=[Helisa]
app.frontend.url=http://localhost:3000
