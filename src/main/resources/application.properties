spring.application.name=docmanager

# ====== DATASOURCE CONFIG ======
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor
spring.datasource.username=gestor_user
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / HIBERNATE CONFIG ======
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ====== LOGS Y FORMATO OPCIONAL ======
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====== EMAIL CONFIG ======
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.from=${MAIL_FROM:noreply@docmanager.com}

# ====== THYMELEAF CONFIG PARA PLANTILLAS DE CORREO ======
spring.thymeleaf.prefix=classpath:/mailTempo/
spring.thymeleaf.suffix=.html
spring.thymeleaf.template-mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ====== APPLICATION CONFIG ======
app.base-url=${APP_BASE_URL:http://localhost:8080}
